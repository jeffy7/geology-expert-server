<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>亿维 EV-FWT 982E 语音盒子本地联调控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fb; margin: 0; padding: 24px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 24px; }
    h2 { margin-top: 0; color: #1f2937; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; }
    .status-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 12px 16px; border-radius: 8px; background: #ecfdf5; border: 1px solid #a7f3d0; font-weight: 500; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #10b981; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
    .btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    button { padding: 10px 18px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .log-box { margin-top: 24px; }
    textarea { width: 100%; box-sizing: border-box; height: 260px; font-family: Menlo, Monaco, monospace; font-size: 13px; background: #111827; color: #10b981; border: none; border-radius: 8px; padding: 14px; resize: vertical; }
  </style>
</head>
<body>

<div class="container">
  <h2>📞 亿维 EV-FWT 982E 语音盒子联调控制台</h2>
  
  <div id="connStatus" class="status-bar">
    <div id="dot" class="status-dot"></div>
    <span id="statusText">正在连接语音盒子 (ws://192.168.2.4:8555/api)...</span>
  </div>

  <div class="form-group">
    <label>设备编号 (Device Name)</label>
    <input type="text" id="devicename" value="EV982EEA9821560762" readonly style="background:#f3f4f6;">
  </div>

  <div class="form-group">
    <label>测试呼叫手机号</label>
    <input type="text" id="phone" placeholder="请输入要测试拨打的手机号码">
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="startDial()">📞 发起呼叫</button>
    <button class="btn-danger" onclick="hangUp()">📴 挂断通话</button>
    <button class="btn-secondary" onclick="getSignal()">📶 获取4G信号</button>
    <button class="btn-secondary" onclick="clearLogs()">🧹 清空日志</button>
  </div>

  <div class="log-box">
    <label>实时交互日志（含按键 DTMF 回调）</label>
    <textarea id="logs" readonly></textarea>
  </div>
</div>

<script>
  let ws = null;
  const WS_URL = 'ws://192.168.2.4:8555/api';
  const logsEl = document.getElementById('logs');
  const statusText = document.getElementById('statusText');
  const dotEl = document.getElementById('dot');

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logsEl.value += `[${time}] ${msg}\n`;
    logsEl.scrollTop = logsEl.scrollHeight;
  }

  function initWs() {
    log(`尝试连接 ${WS_URL}...`);
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      dotEl.style.background = '#10b981';
      statusText.innerText = '✅ 已成功连接语音盒子 (192.168.2.4:8555)';
      log('WebSocket 连接成功！正在初始化设备 OpenDevice_Multi...');
      ws.send(JSON.stringify({ command: 'OpenDevice_Multi' }));
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        log(`📥 收到响应: ${event.data}`);

        // 识别按键事件
        if (data.type === 'DTMF' || data.keypress) {
          const key = data.dynamicdata?.keypress || data.keypress;
          log(`🎯【按键回调】检测到用户手机按下按键: [ ${key} ]`);
          if (key === '1') log('👉 【业务判定】收到 1：专家同意参加！');
          else if (key === '0') log('👉 【业务判定】收到 0：专家放弃/拒绝！');
        }

        // 识别通话状态事件
        if (data.type === 'RealTimeState') {
          log(`📡 通话状态变化: ${data.message || ''}`);
        }
      } catch (e) {
        log(`收到原始消息: ${event.data}`);
      }
    };

    ws.onerror = (err) => {
      dotEl.style.background = '#ef4444';
      statusText.innerText = '❌ 连接失败，请检查网线';
      log('WebSocket 发生错误');
    };

    ws.onclose = () => {
      dotEl.style.background = '#f59e0b';
      statusText.innerText = '⚠️ 连接断开，3秒后重连...';
      log('连接断开');
      setTimeout(initWs, 3000);
    };
  }

  function startDial() {
    const phone = document.getElementById('phone').value.trim();
    const devicename = document.getElementById('devicename').value.trim();
    if (!phone) {
      alert('请输入测试手机号！');
      return;
    }
    const payload = {
      command: 'Dial_Multi',
      arguments: { phone, devicename }
    };
    log(`📞 正在发起外呼 -> ${phone}...`);
    ws.send(JSON.stringify(payload));
  }

  function hangUp() {
    const devicename = document.getElementById('devicename').value.trim();
    const payload = {
      command: 'HangUp_Multi',
      arguments: { devicename }
    };
    log('📴 发送挂断指令...');
    ws.send(JSON.stringify(payload));
  }

  function getSignal() {
    const devicename = document.getElementById('devicename').value.trim();
    const payload = {
      command: 'GetSignalLevel_Multi',
      arguments: { devicename }
    };
    log('📶 获取4G信号强度...');
    ws.send(JSON.stringify(payload));
  }

  function clearLogs() {
    logsEl.value = '';
  }

  // 页面加载自动连接
  initWs();
</script>

</body>
</html>
