# 地调院评审专家系统 - Nginx 生产反向代理配置
# 放置路径建议: /etc/nginx/conf.d/geology-expert.conf

server {
    listen 80;
    server_name _; # 绑定公网 IP 或具体域名

    # 启用 Gzip 压缩，优化轻量服务器带宽
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    # 1. 前端静态页面托管
    location / {
        root /var/www/geology-expert/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 静态资源长效缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/geology-expert/web/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. 后端接口反向代理
    location /etbApi/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # 4. 上传附件静态托管与访问 (支持真实文件下载与直接预览)
    location /uploads/ {
        alias /var/www/geology-expert/server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}

